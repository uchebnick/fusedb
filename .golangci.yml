version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic

  settings:
    errcheck:
      check-blank: false

  exclusions:
    # The supported library and storage engine are held to the release lint
    # gate. Benchmark harnesses and standalone experimental tools are built and
    # vetted separately, but are not part of the public production surface.
    paths:
      - ^benchmarks/
      - ^cmd/
    rules:
      # A deferred Close in a test has no error path worth taking: the test has
      # already passed or failed by the time it runs. Reporting them buried the
      # errcheck findings that do matter in engine code.
      #
      # Deliberately scoped to tests rather than excluding (io.Closer).Close
      # everywhere. Closing a file the engine wrote can fail with the data still
      # unflushed, so that is precisely the case errcheck has to keep flagging.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
