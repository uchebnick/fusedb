services:
  # OneLeaf benchmark with metrics
  oneleaf-bench:
    build:
      context: ../..
      dockerfile: benchmarks/docker/Dockerfile.oneleaf-metrics
    container_name: fusedb-oneleaf-bench
    ports:
      - "9090:9090"  # Prometheus metrics
    environment:
      - GOMAXPROCS=1
      - CACHE_SIZE_MB=64
      - THRESHOLD_MB=10
      - RECORD_COUNT=500000
      - VALUE_SIZE=1024
      - TARGET_RPS=100000
      - RAMP_UP_MINUTES=10
      - TEST_MINUTES=10
      - READ_RATIO=0.8
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - oneleaf-data:/data
    networks:
      - benchmark

  # Pebble benchmark with metrics
  pebble-bench:
    build:
      context: ../..
      dockerfile: benchmarks/docker/Dockerfile.pebble-metrics
    container_name: fusedb-pebble-bench
    ports:
      - "9091:9090"  # Prometheus metrics
    environment:
      - GOMAXPROCS=1
      - CACHE_SIZE_MB=64
      - RECORD_COUNT=500000
      - VALUE_SIZE=1024
      - TARGET_RPS=100000
      - RAMP_UP_MINUTES=10
      - TEST_MINUTES=10
      - READ_RATIO=0.8
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
      - pebble-data:/data
    networks:
      - benchmark

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fusedb-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus-bench.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2h'
    networks:
      - benchmark

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fusedb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - benchmark

volumes:
  oneleaf-data:
  pebble-data:
  prometheus-data:
  grafana-data:

networks:
  benchmark:
    driver: bridge
