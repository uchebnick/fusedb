services:
  # OneLeaf benchmark server
  oneleaf:
    build:
      context: .
      dockerfile: benchmarks/docker/Dockerfile.oneleaf
    container_name: fusedb-oneleaf
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    environment:
      - DB_TYPE=oneleaf
      - CACHE_SIZE_MB=64
      - THRESHOLD_MB=10
      - GOMAXPROCS=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    volumes:
      - oneleaf-data:/data
    networks:
      - benchmark

  # Pebble benchmark server
  pebble:
    build:
      context: .
      dockerfile: benchmarks/docker/Dockerfile.pebble
    container_name: fusedb-pebble
    ports:
      - "8081:8080"
      - "9091:9090"  # Prometheus metrics
    environment:
      - DB_TYPE=pebble
      - CACHE_SIZE_MB=64
      - GOMAXPROCS=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
    volumes:
      - pebble-data:/data
    networks:
      - benchmark

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: fusedb-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./benchmarks/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1h'
    networks:
      - benchmark

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: fusedb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./benchmarks/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./benchmarks/docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - benchmark

  # Load generator
  loadgen:
    build:
      context: .
      dockerfile: benchmarks/docker/Dockerfile.loadgen
    container_name: fusedb-loadgen
    environment:
      - ONELEAF_URL=http://oneleaf:8080
      - PEBBLE_URL=http://pebble:8080
      - DURATION=5m
      - RPS=1000
      - WORKERS=10
    depends_on:
      - oneleaf
      - pebble
    networks:
      - benchmark

volumes:
  oneleaf-data:
  pebble-data:
  prometheus-data:
  grafana-data:

networks:
  benchmark:
    driver: bridge
