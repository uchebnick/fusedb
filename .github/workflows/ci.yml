name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install native LZ4 and goimports
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev
        go install golang.org/x/tools/cmd/goimports@v0.49.0

    - name: Check formatting
      run: make check-format

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.0
        args: --timeout=5m

  test:
    name: Tests with race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install native LZ4
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev

    - name: Run tests
      run: make test

    - name: Verify no-CGO contract
      run: make test-nocgo

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        flags: unit
        disable_search: true
        fail_ci_if_error: false

  build:
    name: Build library and benchmark tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          benchmarks/go.sum

    - name: Install native LZ4
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev

    - name: Build packages
      run: make build

    - name: Test benchmark module
      run: make test-benchmarks

  security:
    name: Vulnerabilities and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install native LZ4
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev

    - name: Scan dependencies
      run: make security

  complete:
    name: CI passed
    if: always()
    needs: [quality, test, build, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
    - name: Verify required jobs
      env:
        QUALITY: ${{ needs.quality.result }}
        TEST: ${{ needs.test.result }}
        BUILD: ${{ needs.build.result }}
        SECURITY: ${{ needs.security.result }}
      run: |
        test "$QUALITY" = success
        test "$TEST" = success
        test "$BUILD" = success
        test "$SECURITY" = success
